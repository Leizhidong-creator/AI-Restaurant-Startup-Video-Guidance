[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "yongge-online"
version = "0.1.0"
description = "餐饮专家在线任务 3 后端与完整业务链路"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22,<1",
  "fastapi>=0.139,<1",
  "greenlet>=3.1,<4",
  "httpx>=0.28,<1",
  "openai>=2.46,<3",
  "pydantic-settings>=2.14,<3",
  "python-multipart>=0.0.22,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.51,<1",
  "websockets>=16,<17",
  "yt-dlp>=2025.1",
]

[project.scripts]
pocketmentor-import-platform-kb = "yongge_online.knowledge.importer:main"

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
  "live: calls paid external services and requires local credentials",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]


